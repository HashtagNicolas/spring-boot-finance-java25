# Configuration de l'application (H2 en memoire pour le squelette)
spring.application.name=bank-api

# Base de donnees H2 embarquee, en memoire, reinitialisee a chaque demarrage
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate genere/valide le schema a partir des entites JPA (pratique pour ce squelette)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console H2 accessible sur /h2-console (utile en developpement)
spring.h2.console.enabled=true
